# 羽毛球预约 —— 唯一权威配置
# 修改保存后，后端 1s 内自动重载并广播到所有客户端。
# token 字段由 mitm_addon.py 自动写入，也可以手工粘贴。

[user]
id = "YOUR_USER_ID"
customer_id = "YOUR_CUSTOMER_ID"
name = "YOUR_NAME"
tel = "YOUR_PHONE"

[gym]
id   = "1297443858304540673"
name = "润杨羽毛球馆"

[network]
mitm_host = "127.0.0.1"
mitm_port = 8080
allowed_hosts = ["reservation.sustech.edu.cn"]

[token]
# page = 页面脚本接入（默认，不启动抓取代理）；mitm = 自动获取，用「配置自动获取.cmd」（仓库里是 setup-capture.cmd）配置后切换
capture_mode = "page"
refresh_timeout_sec = 8
max_refresh_attempts = 2

[connection]
mode = "page"
# Requires an already working, verified local MITM capture route and open official page.
auto_recover = false

[safety]
# 默认 false：抢场 / 自动预约找到空场会直接提交订单。
# 改为 true 是测试模式：完整走一遍流程，但不向学校发送 saveOrder（也可在「设置 → 测试模式」切换）。
dry_run = false
max_order_attempts = 1
max_orders_per_run = 1
order_cooldown_sec = 3

[order]
# 0=今天  1=明天  2=后天
offset_days = 1
token = ""

[auto]
# 兼容旧配置；Rush 优先读 [rush]，缺失时回退到本段
slot_start = "16:00"
slot_end   = "18:00"
refresh_at = "20:00:00"

[rush]
# 放场时刻：ISO 带日期；仅时分秒绑定今天，与预约日期独立。
release_at = "20:00:00"
token_refresh_lead_sec = 120
vid_warmup_sec = 8
scan_window_sec = 60
scan_interval_far_sec = 60
scan_interval_near_sec = 3
repeat_daily = false
stop_after_success = true
# court_priority = [1, 2, 3]
# excluded_courts = []

